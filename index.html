
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Discount Calculator</h1>

        <p class="subtitle">Calculate your savings instantly!</p>

        <label>Original Price</label>
        <input type="number" id="price" placeholder="Enter product price">

        <label>Discount Percentage (%)</label>
        <input type="number" id="discount" placeholder="Enter discount">

        <button onclick="calculateDiscount()">Calculate Discount</button>

        <button class="reset" onclick="clearCalculator()">Reset</button>

        <div id="result">
            <p id="original"></p>
            <p id="saved"></p>
            <p id="final" class="final-price"></p>
        </div>

        <p id="message"></p>

    </div>

    <script src="/function.js"></script>

</body>
</html>
